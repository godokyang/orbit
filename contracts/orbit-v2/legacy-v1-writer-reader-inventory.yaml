---
schema_version: orbit-v1-surface-inventory-v1
captured_against_commit: 87b65a391d08c1ae8045648bf81c6b8dfc7774cf
purpose: Complete repository inventory of shipped v1 readers, writers, schemas, templates,
  runtime guidance, fixtures, and regression surfaces that must be migrated or retired
  at the clean cut.
entry_fields:
- path
- surface_kind
- access_modes
- v1_semantic
- slice6_disposition
access_classes:
  documentation_reader:
    surface_kind: documentation
    access_modes:
    - read
    v1_semantic: teaches v1 artifact or workflow semantics
    slice6_disposition: replace_with_v2_guidance_or_retire
  installer_writer:
    surface_kind: installer
    access_modes:
    - write
    - delete
    v1_semantic: installs or removes shipped v1 runtime files
    slice6_disposition: switch_atomically_to_v2_or_retire
  command_reader_writer:
    surface_kind: cli_entrypoint
    access_modes:
    - read
    - write
    - validate
    - derive
    v1_semantic: dispatches project commands over v1 artifacts
    slice6_disposition: replace_atomically_with_v2_entrypoint
  runtime_reader_writer:
    surface_kind: runtime_module
    access_modes:
    - read
    - write
    - validate
    - derive
    v1_semantic: implements v1 artifact and workflow semantics
    slice6_disposition: migrate_to_exact_v2_or_retire
  package_dispatch:
    surface_kind: package_metadata
    access_modes:
    - dispatch
    - publish
    - test
    v1_semantic: exposes the v1 command and package surface
    slice6_disposition: publish_only_after_v2_clean_cut
  template_writer_input:
    surface_kind: writer_template
    access_modes:
    - read
    - copy
    - write
    v1_semantic: seeds a v1 project artifact
    slice6_disposition: replace_with_v2_template_or_retire
  fixture_reader_input:
    surface_kind: test_fixture
    access_modes:
    - read
    v1_semantic: encodes accepted or rejected v1 semantics
    slice6_disposition: archive_outside_active_root_or_retire
  regression_reader_writer:
    surface_kind: regression_test
    access_modes:
    - read
    - write
    - execute
    v1_semantic: exercises a v1 reader writer validator or gate
    slice6_disposition: replace_with_v2_test_or_archive
slice6_rule: Every path must be migrated to exact v2 semantics or retired; none may
  remain as a compatibility path.
