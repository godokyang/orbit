schema_version: orbit-v2-authority-matrix-v1
protocol_epoch: orbit-v2
facts:
  - fact: project_protocol_epoch_and_genesis_anchor
    authoritative_owner: ProtocolRoot
    lifecycle: create_only
    prohibited_owners: [TaskRevision, WorkUnit, AgentInstance]
  - fact: policy_grants_and_protected_gate_minimums
    authoritative_owner: ProjectPolicyRevision
    lifecycle: create_only_linear_lineage
    authorized_writer: external_user_or_control_plane_authority
    issuer_provenance: exact_authorization_source_ref_and_assertion_digest
  - fact: policy_genesis_and_rotation_issuance
    authoritative_owner: AuthorityAssertion.policy_issuance_envelope
    lifecycle: provider_signed_content_bound_create_only
    prohibited_owners: [ProjectPolicyRevision.mutable_pointer, Lead, AgentInstance]
  - fact: external_authority_verification_receipt
    authoritative_owner: configured_authority_provider
    lifecycle: provider_owned_immutable_receipt
    prohibited_owners: [Lead, AgentInstance, AuthorityAssertion.self_report]
  - fact: task_goal_and_global_contract
    authoritative_owner: TaskRevision
    lifecycle: create_only_revision_lineage
    prohibited_owners: [WorkUnit, WorkUnitAttempt, EvidenceRecord]
  - fact: task_specific_delegated_authority
    authoritative_owner: AuthorizationRecord
    lifecycle: active_policy_authorized_create_only
    subject: canonical_exact_task_revision_scope_digest
    prohibited_owners: [TaskRevision.free_text_authority, Lead]
  - fact: stable_bounded_work_scope
    authoritative_owner: WorkUnit
    lifecycle: create_only
    prohibited_owners: [WorkUnitAttempt, AgentInstance]
  - fact: thesis_semantics
    authoritative_owner: ChangeThesis
    lifecycle: create_only_revision
    prohibited_owners: [WorkUnit.mutable_current_pointer]
  - fact: assignment_and_execution_history
    authoritative_owner: WorkUnitAttempt
    lifecycle: immutable_identity_plus_append_only_events
    prohibited_owners: [WorkUnit]
  - fact: lifecycle_writer_timestamp_and_receipt
    authoritative_owner: configured_lifecycle_writer_provider
    lifecycle: provider_signed_append_only_event_provenance
    prohibited_owners: [AgentInstance.self_report, WorkUnitAttempt.self_report, LeadSession.self_report]
  - fact: work_unit_and_attempt_authorization_scope
    authoritative_owner: AuthorizationRecord
    lifecycle: active_policy_authorized_create_only
    subject: canonical_exact_work_unit_action_scope_digest_including_writable_paths
    prohibited_owners: [WorkUnit.free_text_authority, WorkUnitAttempt.free_text_authority]
  - fact: agent_lifecycle
    authoritative_owner: AgentInstance
    lifecycle: immutable_identity_plus_append_only_events
  - fact: agent_runtime_identity_capabilities_and_permissions
    authoritative_owner: AgentInstance
    lifecycle: provider_verified_unique_runtime_subject_plus_immutable_profile_and_append_only_lifecycle
  - fact: logical_lead_orchestration_identity
    authoritative_owner: LogicalLead
    lifecycle: create_only
  - fact: lead_session_generation_and_recovery_continuity
    authoritative_owner: LeadSession
    lifecycle: immutable_identity_plus_append_only_events
  - fact: control_identity_genesis_and_task_ownership
    authoritative_owner: LeadControlRegistry
    lifecycle: create_only
    prohibited_owners: [LeadSession.self_report, AgentInstance.self_report, Lead.self_report]
  - fact: checkpoint_lineage_and_coordinator_decision_stream
    authoritative_owner: LeadCheckpoint
    lifecycle: create_only_append_only_linear
    prohibited_owners: [WorkUnitAttempt, LeadSession]
  - fact: task_ownership_transfer
    authoritative_owner: LeadCheckpoint
    lifecycle: release_or_relinquishing_suspend_then_acquire_exact_provenance
    exact_bindings: [released_checkpoint_ref_id_and_digest, released_lead_control_id, task_ref_task_id_task_revision_id_and_digest]
    prohibited_owners: [LeadControlRegistry.mutable_ownership, AgentInstance.alias]
  - fact: canonical_runtime_subject_active_binding
    authoritative_owner: LeadSession
    lifecycle: at_most_one_active_lead_session_per_provider_verified_canonical_subject_project_wide
    exact_bindings: [provider_id, runtime_subject_id, terminal_release_then_successor_bind_provenance]
    prohibited_owners: [AgentInstance.string_identity, LeadSession.self_report]
  - fact: assigned_and_submitted_rule_set
    authoritative_owner: RuleResolutionArtifact
    lifecycle: content_addressed_create_only
    prohibited_owners: [WorkUnitAttempt.required_rules, EvidenceRecord.required_rules]
  - fact: implementation_or_evaluator_submission_provenance
    authoritative_owner: EvidenceRecord
    lifecycle: create_only
    prohibited_owners: [GateEvaluation.submission_copy]
    trust_boundary: record_internal_artifact_claim_not_external_byte_or_existence_proof
  - fact: gate_definition_and_subject_selection_policy
    authoritative_owner: GateRequirement
    lifecycle: create_only_per_task_revision_with_stable_lineage
  - fact: protected_task_change_approval
    authoritative_owner: AuthorizationRecord.protected_change_envelope
    lifecycle: provider_scope_bound_content_addressed_create_only
    prohibited_owners: [TaskRevision.free_text_approval, Lead]
  - fact: evaluator_verdict_and_question_or_acceptance_answers
    authoritative_owner: GateEvaluation
    lifecycle: create_only
    prohibited_owners: [EvidenceRecord]
  - fact: finding_identity_body_and_severity
    authoritative_owner: Finding
    lifecycle: create_only
    prohibited_owners: [EvidenceRecord, GateEvaluation.inline_finding_body]
  - fact: finding_disposition
    authoritative_owner: FindingResolution
    lifecycle: append_only
    prohibited_owners: [Lead.free_text_waiver, GateEngine]
  - fact: closure_validation
    authoritative_owner: GateEngine
    lifecycle: deterministic_projection
    persisted_authority: false
  - fact: code_surface
    authoritative_owner: derived_projection
    lifecycle: reproducible_from_versioned_inputs
    persisted_authority: false
  - fact: relationship_view
    authoritative_owner: derived_projection
    lifecycle: reproducible_from_authority_objects
    persisted_authority: false
  - fact: active_roster
    authoritative_owner: derived_projection
    lifecycle: derived_from_agent_and_attempt_events
    persisted_authority: false

authority_invariants:
  - Lead cannot create or impersonate bootstrap user/control-plane authority.
  - Every ProjectPolicyRevision and issuance source ref pin the exact provider-verified assertion digest in addition to its stable assertion ID; same-ID assertion replacement fails closed.
  - Genesis and rotation receipts sign an immutable issuance envelope containing the exact candidate policy ID/content digest and assertion digest; changing candidate or issuer bytes makes the receipt unusable.
  - Every policy successor is authorized by the unique policy.rotate grant of its exact parent; absence or revocation fails closed.
  - ProjectPolicyRevision authority actions and protected minimum gate kinds are unique semantic keys, so array order cannot change authority.
  - Every task has exactly one parentless revision-number-1 TaskRevision genesis and one connected, contiguous, linear successor chain.
  - Lead cannot remove or weaken protected gates through a revision hop without inherited authorization.
  - Every TaskRevision gate ref resolves to a GateRequirement owned by that exact revision; every reused gate lineage, protected or not, uses a content-addressed immediate-parent ref.
  - Gate lineage compatibility is derived by traversing validated parent refs, never by matching a caller-supplied lineage ID alone.
  - Protected-change authority is provider-bound to the exact project, task, parent/candidate revision digests, canonical protected-change digest, and current active policy; superseded-policy grants are not replayable.
  - Lead cannot make itself risk owner, adjudicator, or waiver issuer by writing a name.
  - TaskRevision authority refs use only frozen delegation actions and bind the canonical exact task/revision scope; cross-action and cross-subject refs fail closed.
  - Gate Engine validates authority and derives closure; it cannot waive or rewrite facts.
  - Closure eligibility is never caller-owned; active Attempts and accepted submissions require the TaskRevision active-policy ref, while terminal history is retained only when provider-recorded Attempt start/end are monotonic and both they and EvidenceRecord acceptance precede the first successor-policy issuance.
  - EvidenceRecord acceptance_recorded_at is part of the create-only content digest; changing acceptance chronology changes every dependent subject ref.
  - Independent evaluation is checked against every producer's verified provider/runtime-subject identity in the canonical subject; a different AgentInstance ID cannot create independence.
  - A newer evaluation does not erase an unresolved older blocking Finding.
  - Assignment role, context generation, capability, permission, allowed action, and WorkUnit-kind/purpose compatibility are derived from AgentInstance and WorkUnit authority; Assignment cannot self-assert them.
  - AttemptCreated is valid only while its AgentInstance is active and after the exact bound context generation exists in provider-recorded lifecycle chronology.
  - WorkUnit authorization refs are non-empty and bind every allowed executable action to exact canonical work scope; Attempt snapshots pin a non-empty exact record set compatible with their assignment purpose/action.
  - Accepted implementation EvidenceRecord self-checks exactly cover WorkUnit acceptance/evidence refs and contain non-empty changed paths, verification, scope, thesis, and artifact provenance; passing GateEvaluation answers cite non-empty subject evidence.
  - ArtifactClaim validation proves only exact identity/digest/kind closure inside one EvidenceRecord; without a trusted resolver it does not prove external existence, external bytes, or truth and cannot itself close a gate.
  - Only change ArtifactClaims carry non-empty canonical repository paths; verification and report ArtifactClaims are path-free and never participate in changed-path authority.
  - Implementation changed paths are canonical repo-relative POSIX paths and exactly equal change-claim paths within both WorkUnit writable authority and canonical CodeSurface; matching is segment-aware and filesystem-independent.
  - WorkUnit, Attempt, ChangeThesis, RuleResolutionArtifact, EvidenceRecord, and evaluation subject membership share one exact project/task/revision/unit lineage.
  - GateEvaluation finding refs and TaskRevision unresolved finding refs resolve bidirectionally through the Finding gate/task lineage.
  - Addressed or disproved FindingResolution provenance content-addresses the exact authorized GateEvaluation for the Finding GateRequirement and subject.
  - Addressed or disproved FindingResolution uses a distinct follow-up GateEvaluation or adjudication record in the stable gate lineage; the source evaluation cannot resolve its own Finding.
  - Addressed, disproved, and waived resolution provenance fields are mutually exclusive.
  - Waived FindingResolution has no supporting EvidenceRecord refs; its active-policy AuthorizationRecord is the sole provenance.
  - Evidence-level and independence ordering come from one GateStrength table whose keys exactly equal the schema enums.
  - A TaskRevision may own multiple same-kind GateRequirements with distinct lineages/selectors; every matching protected requirement must meet the policy minimum, independent of gate ref order.
  - Every supersedes or related ref resolves to a non-self immutable record in a compatible task, GateRequirement, and subject lineage; supersedes cycles are forbidden.
  - Every ChangeThesis lineage has exactly one revision 1 genesis; WorkUnit initial refs pin that genesis and Attempt refs pin it or a contiguous successor.
  - Every accepted LeadCheckpoint decision is byte-equal to the deterministic LeadControl.reconcile projection over the exact pinned facts; a self-reported decision fails closed on replay.
  - Every WorkUnitAttempt dispatch ref resolves to an accepted same-control LeadCheckpoint whose selection exactly matches the Attempt; its exact AttemptCreated observation checkpoint is the immediate successor of that dispatch checkpoint, so intervening checkpoints and non-tip dispatch refs fail closed; historical checkpoint pins never read a later attempt event.
  - Recovery re-runs the unique lineage tip's own stored-trigger pipeline only, so stop-loss/dependency/fuse outcomes are recomputed exactly and frozen decisions never thaw; a non-tip checkpoint cannot authorize recovery.
  - LeadControlRegistry is create-only: it carries no active-session pointer, genesis exact-pins the initial LeadSession, and the current active LeadSession is derived from the unique lineage tip plus the session lineage, never from registry state.
  - Every change trigger (session/task-revision/scope/thesis/finding/gate/context/authority/dependency) is accepted only when its exact authoritative projection differs from the exact lineage predecessor; the enum alone never proves a change. Finding/gate deltas are proven only by new exact finding/gate_evaluation refs in the checkpoint's supporting provenance; FindingResolution/GateRequirement-record subtypes fail closed in Inc2.
  - Thesis/verification-plan redirection is proven only by a single exact proposed successor change_thesis/rule_resolution ref in the authorizing checkpoint's provenance compared to the predecessor's effective basis (ADR-006:177); zero/multiple proposals fail closed, at most one exact ref per kind per checkpoint is allowed (distinct or repeated identical refs are rejected by `checkpoint_proposal_ambiguous`), and the later AttemptCreated assignment must match the authorized proposal.
  - Multiple open control lineages run in parallel only when their derived tip task ownership sets and active canonical runtime-subject sets (provider_id + runtime_subject_id from the verified AgentInstance identity) are pairwise disjoint; AgentInstance IDs or aliases never stand in for the canonical subject, and overlapping task sets fail closed.
  - One Task/LogicalLead belongs to at most one open queue and is active-selected by at most one accepted tip; a lineage tip can claim only logical leads whose task its own tip queue owns.
  - One canonical runtime subject binds at most one active LeadSession project-wide; subject reuse across controls requires exactly one origin lineage and exact terminal/release -> successor/bind transfer chains, and a root session reusing a subject present in another control fails closed.
  - Task transfer requires the old lineage's accepted release or relinquishing-suspend checkpoint first (queue removes exactly one owned task and its active selection, with no non-terminal Attempt of that task in the releasing control), then the new lineage's accepted acquire checkpoint binding the exact released checkpoint ref+digest, old/new control IDs, and Task/TaskRevision refs; every release/suspend has exactly one matching acquire, and missing release, early acquire, wrong refs/digest/task/control, duplicate ownership, and replay fail closed. The registry stays the immutable genesis claim; derived tip queues evolve through transfer provenance.
  - A successor Attempt may cross control lineages only when its control validly acquired the Attempt's task from the predecessor's control (exact release/acquire provenance) and the predecessor Attempt is terminal; otherwise the frozen same-control successor rule applies.
