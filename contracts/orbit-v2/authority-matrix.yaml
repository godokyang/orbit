authority_invariants:
  - Lead cannot create or impersonate bootstrap user/control-plane authority.
  - Every ProjectPolicyRevision and issuance source ref pin the exact provider-verified assertion digest in addition to its stable assertion ID; same-ID assertion replacement fails closed.
  - Genesis and rotation receipts sign an immutable issuance envelope containing the exact candidate policy ID/content digest and assertion digest; changing candidate or issuer bytes makes the receipt unusable.
  - Every policy successor is authorized by the unique policy.rotate grant of its exact parent; absence or revocation fails closed.
  - ProjectPolicyRevision authority actions and protected minimum gate kinds are unique semantic keys, so array order cannot change authority.
  - Every task has exactly one parentless revision-number-1 TaskRevision genesis and one connected, contiguous, linear successor chain.
  - Lead cannot remove or weaken protected gates through a revision hop without inherited authorization.
  - Every TaskRevision gate ref resolves to a GateRequirement owned by that exact revision; every reused gate lineage, protected or not, uses a content-addressed immediate-parent ref.
  - Gate lineage compatibility is derived by traversing validated parent refs, never by matching a caller-supplied lineage ID alone.
  - Protected-change authority is provider-bound to the exact project, task, parent/candidate revision digests, canonical protected-change digest, and current active policy; superseded-policy grants are not replayable.
  - Lead cannot make itself risk owner, adjudicator, or waiver issuer by writing a name.
  - TaskRevision authority refs use only frozen delegation actions and bind the canonical exact task/revision scope; cross-action and cross-subject refs fail closed.
  - Gate Engine validates authority and derives closure; it cannot waive or rewrite facts.
  - Closure eligibility is never caller-owned; active Attempts and accepted submissions require the TaskRevision active-policy ref, while terminal history is retained only when provider-recorded Attempt start/end are monotonic and both they and EvidenceRecord acceptance precede the first successor-policy issuance.
  - EvidenceRecord acceptance_recorded_at is part of the create-only content digest; changing acceptance chronology changes every dependent subject ref.
  - Independent evaluation is checked against every producer's verified provider/runtime-subject identity in the canonical subject; a different AgentInstance ID cannot create independence.
  - A newer evaluation does not erase an unresolved older blocking Finding.
  - Finding blocking is never agent-writable: Finding.basis is a required typed enum (contract_violation | regression | newly_discovered_risk | hardening_opportunity) and the active ProjectPolicyRevision's closed finding_disposition mapping derives blocking/nonblocking/adjudication_required; contract_violation/regression block closure until an authorized FindingResolution tip exists, unresolved hardening_opportunity never blocks, and an unadjudicated newly_discovered_risk must be introduced through exact finding_change checkpoint provenance (absence fails closed) and replays to needs_user/escalate awaiting authority_change with hard precedence over warning/blocked assessment layers; replay consumes only an exact FindingResolution ref pinned by the checkpoint itself, so a later resolution never rewrites accepted checkpoint history; the resume is an immediate authority_change successor whose exact predecessor is the needs_user/escalate finding_change checkpoint and whose newly pinned valid FindingResolution refs cover every risk that predecessor introduced left unadjudicated — unrelated, partial, or stale pins fail closed in the trigger proof and the replay.
  - An unverified budget measurement closes only through the one-way C_pending -> independent GateEvaluation -> immediate successor C_reviewed chain: the GateRequirement selector must explicitly require budget assessment; the budget_assessment_result exact-binds the assessed checkpoint ref+digest, the COMPLETE assessed binding digest, lead_control, scope and both metric statuses (at least one unverified, exact-match); freshness is the byte-identical budget_review_subject_projection excluding only review_status/lead_disposition/review_gate_evaluation_ref (the complete binding digest is never a freshness basis) with the ONE typed exception that the consuming successor may flip an assessed mode=current adjustment source to mode=inherited once, with the same adjustment_digest, inherited_checkpoint_ref exactly equal to the assessed predecessor ref, and every other projected byte equal; self/circular, non-immediate-predecessor, cross-binding, ordinary-evaluation, missing-selector, mismatched and non-independent paths fail closed; accepted continues the ordinary flow, unlocks the lead_adjustment path, and rejected replays frozen for deterministic replan.
  - Assignment role, context generation, capability, permission, allowed action, and WorkUnit-kind/purpose compatibility are derived from AgentInstance and WorkUnit authority; Assignment cannot self-assert them.
  - AttemptCreated is valid only while its AgentInstance is active and after the exact bound context generation exists in provider-recorded lifecycle chronology.
  - WorkUnit authorization refs are non-empty and bind every allowed executable action to exact canonical work scope; Attempt snapshots pin a non-empty exact record set compatible with their assignment purpose/action.
  - Accepted implementation EvidenceRecord self-checks exactly cover WorkUnit acceptance/evidence refs and contain non-empty changed paths, verification, scope, thesis, and artifact provenance; passing GateEvaluation answers cite non-empty subject evidence.
  - ArtifactClaim validation proves only exact identity/digest/kind closure inside one EvidenceRecord; without a trusted resolver it does not prove external existence, external bytes, or truth and cannot itself close a gate.
  - Only change ArtifactClaims carry non-empty canonical repository paths; verification and report ArtifactClaims are path-free and never participate in changed-path authority.
  - Every EvidenceRequirement carries a required verification_class (regression | release_audit | acceptance_evidence); each implementation evidence_requirement_result carries a required verification_use that exact-pairs with its requirement's class (regression/permanent_test_evidence, release_audit/audit_record_evidence, acceptance_evidence/acceptance_proof_evidence), and its evidence refs must resolve to compatible record-owned ArtifactClaim kinds (permanent->verification, audit/acceptance->report); missing/unknown values, class/use mismatches, unresolved refs, and incompatible kinds fail closed without free-text inspection.
  - Implementation changed paths are canonical repo-relative POSIX paths and exactly equal change-claim paths within both WorkUnit writable authority and canonical CodeSurface; matching is segment-aware and filesystem-independent.
  - WorkUnit, Attempt, ChangeThesis, RuleResolutionArtifact, EvidenceRecord, and evaluation subject membership share one exact project/task/revision/unit lineage.
  - GateEvaluation finding refs and TaskRevision unresolved finding refs resolve bidirectionally through the Finding gate/task lineage.
  - Addressed or disproved FindingResolution provenance content-addresses the exact authorized GateEvaluation for the Finding GateRequirement and subject.
  - Addressed or disproved FindingResolution uses a distinct follow-up GateEvaluation or adjudication record in the stable gate lineage; the source evaluation cannot resolve its own Finding.
  - Addressed, disproved, and waived resolution provenance fields are mutually exclusive.
  - Waived FindingResolution has no supporting EvidenceRecord refs; its active-policy AuthorizationRecord is the sole provenance.
  - Evidence-level and independence ordering come from one GateStrength table whose keys exactly equal the schema enums.
  - A TaskRevision may own multiple same-kind GateRequirements with distinct lineages/selectors; every matching protected requirement must meet the policy minimum, independent of gate ref order.
  - Every supersedes or related ref resolves to a non-self immutable record in a compatible task, GateRequirement, and subject lineage; supersedes cycles are forbidden.
  - Every ChangeThesis lineage has exactly one revision 1 genesis; WorkUnit initial refs pin that genesis and Attempt refs pin it or a contiguous successor.
  - Every accepted LeadCheckpoint decision is byte-equal to the deterministic LeadControl.reconcile projection over the exact pinned facts; a self-reported decision fails closed on replay.
  - Every WorkUnitAttempt dispatch ref resolves to an accepted same-control LeadCheckpoint whose selection exactly matches the Attempt; its exact AttemptCreated observation checkpoint is the immediate successor of that dispatch checkpoint, so intervening checkpoints and non-tip dispatch refs fail closed; historical checkpoint pins never read a later attempt event.
  - Recovery re-runs the unique lineage tip's own stored-trigger pipeline only, so stop-loss/dependency/fuse outcomes are recomputed exactly and frozen decisions never thaw; a non-tip checkpoint cannot authorize recovery.
  - LeadControlRegistry is create-only: it carries no active-session pointer, genesis exact-pins the initial LeadSession, and the current active LeadSession is derived from the unique lineage tip plus the session lineage, never from registry state.
  - Every change trigger (session/task-revision/scope/thesis/finding/gate/context/authority/dependency) is accepted only when its exact authoritative projection differs from the exact lineage predecessor; the enum alone never proves a change. Finding/gate deltas are proven only by new exact finding/gate_evaluation refs in the checkpoint's supporting provenance; FindingResolution/GateRequirement-record subtypes fail closed in Inc2.
