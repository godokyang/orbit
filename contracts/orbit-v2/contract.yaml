      timer_produces_only_checkpoint_due: true
      checkpoint_due_only_from_exact_scheduled_predecessor: true
      due_receipt: provider_verified_control.checkpoint_due.observe_assertion
      due_scope_binds: [project, active_policy, lead_control_id, scheduled_checkpoint_ref_and_digest, deadline, observed_at]
