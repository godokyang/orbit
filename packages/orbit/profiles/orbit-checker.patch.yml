# Orbit checker profile overlay: read-only tools, no write paths, no approvals.
- id: sandbox-policy
  config:
    mode: read-only
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: orbit-checker
    presets:
      orbit-checker:
        sandbox: read-only
        approval: never
        name: Orbit checker
        description: Independent read-only checker process.

# Unattended profiles must never take the default Web UI port. The web host
# still composes (the SDK app expects it) but binds an ephemeral port so a
# human DSH Web session can use 127.0.0.1:3080 at the same time.
- id: webserver
  config:
    host: 127.0.0.1
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
